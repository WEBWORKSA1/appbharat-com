name: Daily news auto-update
on:
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python3 scripts/update_news.py
      - run: sed -i -E "s#<lastmod>[0-9-]+</lastmod>#<lastmod>$(date -u +%F)</lastmod>#g" sitemap.xml
      - run: |
          git config user.name "appbharat-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/news.json sitemap.xml
          git diff --cached --quiet || git commit -m "Auto-update news [skip ci]"
          git push
